<script>
// リンクの末尾に余計な文字が付いてしまったURLを、正しいページへ自動で戻す。
// 例: /shorui.html%EF%BF%BC%E2%96%A0 → /shorui.html
(function () {
  var known = ["shorui","agent-erabi","ai-fukugyo","ai-career","fukugyo","kokoro",
               "freelance-yametai","entertainment-kyujin","agent-hikaku","about","contact","index"];
  var path = "";
  try { path = decodeURIComponent(location.pathname); } catch (e) { path = location.pathname; }
  for (var i = 0; i < known.length; i++) {
    if (path.indexOf("/" + known[i] + ".html") === 0) {
      location.replace("/" + known[i] + ".html" + location.search);
      return;
    }
  }
})();
</script>
